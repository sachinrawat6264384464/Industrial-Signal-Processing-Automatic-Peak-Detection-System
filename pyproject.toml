[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "industrial-signal-analyzer"
version = "1.0.0"
description = "Industrial Signal Processing and Peak Detection Application for UEF & Marginum 2026"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.2.0",
    "matplotlib>=3.7.0",
    "pyqtgraph>=0.13.0",
    "PySide6>=6.5.0",
]

[project.scripts]
industrial-signal-analyzer = "main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
